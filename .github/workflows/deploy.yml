name: Deploy Laravel

on:
  push:
    branches: [master, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to production
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/erp-backend-master
            git pull origin master
            composer install --no-dev --optimize-autoloader
            # Schema before caches. Without this the deploy shipped code that
            # read columns the database had not got, and the failure surfaced
            # at request time instead of here, where somebody is watching.
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # No key:generate. It rotates APP_KEY on every deploy, which
            # invalidates every session and every encrypted value. A key is
            # provisioned once, by hand, and then left alone.

            # No db:seed. That command means DatabaseSeeder, which also plants
            # demo employees, demo clients and @company.com logins.
            #
            # The reference data — permissions, the expense catalogue, the
            # accounting calendar, statutory payroll rates — is now separable and
            # safe to re-run:
            #
            #   php artisan db:seed --class=ReferenceDataSeeder --force
            #
            # It is not automatic yet on purpose. PayrollSeeder and
            # AssetCategorySeeder have never run on this database, so the first
            # run inserts rather than upserts and wants somebody watching it.
            # Once it has been run by hand and the result checked, add it here.
            # See docs/seeding-in-production.md.

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/erp-backend-staging
            git pull origin staging
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
