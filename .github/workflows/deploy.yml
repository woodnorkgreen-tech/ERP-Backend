name: Deploy Laravel

on:
  push:
    branches: [master, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to production
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/erp-backend-master
            git pull origin master
            composer install --no-dev --optimize-autoloader
            # Schema before caches. Without this the deploy shipped code that
            # read columns the database had not got, and the failure surfaced
            # at request time instead of here, where somebody is watching.
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            # Stores-to-Finance now posts synchronously because production shared
            # hosting has no service supervisor. Drain records left by the former
            # queue-based implementation once on every deploy; new movements do
            # not depend on this command or on a background worker.
            php artisan stores:process-finance-postings

            # No key:generate. It rotates APP_KEY on every deploy, which
            # invalidates every session and every encrypted value. A key is
            # provisioned once, by hand, and then left alone.

            # No db:seed, and no ReferenceDataSeeder either. Most reference
            # seeders overwrite rows people edit in the app (expense codes,
            # payroll rates, settings, team and design types), so re-running
            # them on every deploy would quietly undo those edits. Seeding stays
            # a deliberate, attended step: docs/seeding-in-production.md.
            #
            # What runs instead is the check that seeding is needed. It is
            # read-only, and it is LAST on purpose: this script's exit status
            # is its last command's, so missing reference data turns the run
            # red and prints the fix. On 2026-09-29 production served 2 of 76
            # purchase categories behind a green deploy until a user noticed.
            php artisan finance:readiness

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/erp-backend-staging
            git pull origin staging
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan stores:process-finance-postings
            # Last, so its exit status is the run's. See the production job.
            php artisan finance:readiness
