name: Deploy Laravel

on:
  push:
    branches: [master, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to production
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/erp-backend-master
            git pull origin master
            composer install --no-dev --optimize-autoloader
            # Schema before caches. Without this the deploy shipped code that
            # read columns the database had not got, and the failure surfaced
            # at request time instead of here, where somebody is watching.
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # No key:generate. It rotates APP_KEY on every deploy, which
            # invalidates every session and every encrypted value. A key is
            # provisioned once, by hand, and then left alone.

            # No db:seed. ChartOfAccountSeeder deletes accounts outside its own
            # list, so seeding is a deliberate act against a known chart, never
            # a step in shipping code.

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/erp-backend-staging
            git pull origin staging
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
